spring:
  application:
    name: pedidos

  kafka:
    bootstrap-servers: 'http://localhost:29092'
    consumer:
      group-id: icompras-atualizacao-pedido
      auto-offset-reset: earliest

  datasource:
    url: jdbc:postgresql://177.153.39.4:5555/icompraspedidos
    username: pedido_user
    password: pedido123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

icompras:
  pedidos:
    clients:
      produtos:
        url: "http://localhost:8081/produtos"
      clientes:
        url: "http://localhost:8082/clientes"

  config:
    kafka:
      server-url: 'http://localhost:29092'
      topics:
        pedidos-pagos: 'icompras.pedidos-pagos'
        pedidos-faturados: 'icompras.pedidos-faturados'
        pedidos-enviados: 'icompras.pedidos-enviados'
